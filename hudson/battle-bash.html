<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Battle Bash</title>
<style>
:root{--panel:#151922;--card:#202633;--text:#f4f7fb;--muted:#b8c0ce;--border:#3a4352;--accent:#5aa7ff;--accent-bg:#2d6db6;--series3:#48c774;--series4:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:#0c0f14;color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.hidden{display:none!important}.app{width:min(1100px,100%);margin:0 auto;padding:18px}.panel{border:1px solid var(--border);background:var(--panel);border-radius:16px;padding:20px}.card{border:1px solid var(--border);background:var(--card);border-radius:14px}.center{text-align:center}.title{font-size:clamp(2rem,5vw,3.2rem);font-weight:900}.muted{color:var(--muted)}.grid2,.grid3,.grid4{display:grid;gap:12px}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}.btn{min-height:46px;border-radius:12px;border:1px solid var(--border);background:#1b2230;padding:10px 14px;font-weight:800}.btn.primary{background:var(--accent-bg);border-color:transparent}.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.sectionHead h2{margin:0}.char{width:100%;height:auto;overflow:visible}.fighter .body{transition:transform .12s ease,filter .12s ease}.fighter.attack .body{transform:translateX(12px) rotate(-4deg) scale(1.06)}.fighter.hit .body{transform:translateX(-7px) rotate(7deg) scale(.95)}.fighter.block .body{transform:scale(.92);filter:brightness(.72)}.pick.selected,.level.selected{outline:3px solid var(--accent);outline-offset:2px}.arena-copy{background:rgba(0,0,0,.74);backdrop-filter:blur(2px);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:12px;position:absolute;left:12px;right:12px;bottom:12px}.retro-on #arena{filter:contrast(1.4) saturate(1.25);image-rendering:pixelated}.retro-on #arena:after{content:'';position:absolute;inset:0;z-index:25;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 3px,transparent 3px 7px)}.retro-on .char *{shape-rendering:crispEdges}.fighterGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.pick{border:1px solid var(--border);background:var(--card);border-radius:14px;padding:12px;text-align:left}.pick .art{width:96px;margin:0 auto}.levelGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.level{min-height:170px;border:1px solid var(--border);border-radius:14px;position:relative;overflow:hidden;text-align:left;padding:0;color:#fff}.missionGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.mission{padding:14px}.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;padding:12px}.bar{height:14px;border-radius:999px;border:1px solid var(--border);overflow:hidden;margin-top:6px}.bar>div{height:100%}.hpP{background:var(--series3)}.hpE{background:var(--series4);margin-left:auto}.arena{height:390px;border:1px solid var(--border);border-radius:16px;overflow:hidden;position:relative}.msg{position:absolute;left:50%;top:24px;transform:translateX(-50%);z-index:30;font-size:1.6rem;font-weight:900;color:#fff;text-align:center}.fighter{position:absolute;bottom:18%;width:145px;z-index:10}.fighter.player{left:10%}.fighter.enemy{left:70%}.label{background:rgba(0,0,0,.5);border-radius:999px;padding:3px 8px;font-size:.75rem;font-weight:800;text-align:center}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}.controlCard{padding:12px}.controlRow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.attackRow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.rule{padding:9px 12px;text-align:center;font-weight:900}.end{padding:16px;text-align:center}.endBtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}@media(max-width:800px){.fighterGrid{grid-template-columns:repeat(3,minmax(0,1fr))}.levelGrid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.app{padding:10px}.grid2,.grid3,.grid4,.fighterGrid,.missionGrid,.levelGrid,.controls,.endBtns{grid-template-columns:1fr}.hud{grid-template-columns:1fr}.fighter{width:110px}.fighter.enemy{left:62%}.arena{height:330px}.attackRow{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="battle-bash-advanced-roster" class="app">
<section id="menu" class="panel center"><div class="title">BATTLE BASH</div><div class="muted">Choose a fighter, pick an arena, and battle.</div><div class="grid2" style="margin-top:18px"><button id="playBtn" class="btn primary">PLAY</button><button id="missionsBtn" class="btn">MISSIONS</button></div><div style="margin-top:14px">Unlocked: <strong id="unlockCount"></strong></div></section>
<section id="missions" class="hidden"><div class="sectionHead"><div><h2>Missions</h2><div class="muted">Unlock stronger fighters by playing.</div></div><button class="btn toMenu">← Menu</button></div><div id="missionGrid" class="missionGrid"></div></section>
<section id="select" class="hidden"><div class="sectionHead"><div><h2>Choose Fighter</h2><div class="muted">Distinct advanced skins restored.</div></div><button class="btn toMenu">← Menu</button></div><div id="fighterGrid" class="fighterGrid"></div><button id="levelsBtn" class="btn primary" style="width:100%;margin-top:14px">CHOOSE ARENA</button></section>
<section id="map" class="hidden"><div class="sectionHead"><div><h2>Choose Arena</h2><div class="muted">All classic and special arenas are back.</div></div><button id="backFighter" class="btn">← Fighter</button></div><div id="levelGrid" class="levelGrid"></div></section>
<section id="fight" class="hidden"><div id="ruleBanner" class="card rule hidden"></div><div class="card hud" style="margin-top:10px"><div><div id="pName"></div><div class="bar"><div id="pHP" class="hpP"></div></div></div><div class="center"><div id="fightLevel" class="muted" style="font-size:.75rem"></div><div id="timer" style="font-size:1.4rem;font-weight:900">60</div></div><div style="text-align:right"><div id="eName"></div><div class="bar"><div id="eHP" class="hpE"></div></div></div></div><div id="arena" tabindex="0" class="arena" style="margin-top:10px"><div id="msg" class="msg"></div><div id="player" class="fighter player"><div class="body"></div><div id="leftLabel" class="label">YOU</div></div><div id="enemy" class="fighter enemy"><div class="body" style="transform:scaleX(-1)"></div><div id="rightLabel" class="label">CPU</div></div></div><div id="controls" class="controls" style="margin-top:10px"><div class="card controlCard"><strong>Movement</strong><div class="controlRow" style="margin-top:8px"><button id="left" class="btn primary">←</button><button id="jump" class="btn primary">↑ Jump</button><button id="right" class="btn primary">→</button></div></div><div class="card controlCard"><strong>Attacks</strong><div class="attackRow" style="margin-top:8px"><button id="jab" class="btn primary">J · Jab</button><button id="kick" class="btn primary">K · Kick</button><button id="special" class="btn primary">L · Special</button><button id="block" class="btn">S · Block</button></div></div></div><div id="end" class="card end hidden" style="margin-top:10px"><div id="endTitle" style="font-size:1.6rem;font-weight:900"></div><div id="unlockNotice" class="hidden" style="margin-top:8px;font-weight:800"></div><div class="endBtns"><button id="rematch" class="btn primary">REMATCH</button><button id="changeLevel" class="btn">CHANGE ARENA</button><button id="fightMenu" class="btn">MAIN MENU</button></div></div></section>

bf9168"/><path d="M43 71h59l5 61H38Z" fill="#8f7044"/><path d="m40 80-25 19 12 46 22-19Zm64 0 25 19-12 46-22-19Z" fill="#c19b61"/><path d="M45 130h21l-7 64H35Zm31 0h21l12 64H82Z" fill="#4f3e28"/></svg>`;case'pulse':return `<svg class="char" viewBox="0 0 145 220"><path d="M45 33Q72 8 99 33l-5 31H49Z" fill="#28265a"/><path d="M50 41h43v15H50Z" fill="#48439b"/><rect x="59" y="46" width="25" height="4" rx="2" fill="#c4c1ff"/><path d="M44 68h56l5 59H39Z" fill="#4d4a92"/><path d="m42 76-24 18 11 45 21-18Zm60 0 24 18-11 45-21-18Z" fill="#7974cd"/><path d="M45 125h20l-6 67H35Zm31 0h20l11 67H82Z" fill="#2b2957"/><path d="M101 85q25 12 16 37" stroke="#c4c1ff" stroke-width="5" fill="none"/></svg>`;case'drake':return `<svg class="char" viewBox="0 0 150 220"><path d="m39 40-11-27 28 18L72 7l16 24 28-18-11 28-8 25H47Z" fill="#793d35"/><circle cx="72" cy="46" r="18" fill="#c38e6b"/><path d="M43 71h60l5 61H38Z" fill="#7d4037"/><path d="m40 80-25 19 12 46 22-20Zm65 0 26 19-13 46-22-20Z" fill="#ab6153"/><path d="M45 130h21l-7 64H35Zm31 0h21l12 64H82Z" fill="#442521"/><path d="m54 84 18 15 20-15" stroke="#d98973" stroke-width="6" fill="none"/></svg>`;case'oracle':return `<svg class="char" viewBox="0 0 145 220"><path d="M43 35Q72 7 101 35l-6 31H48Z" fill="#403653"/><circle cx="72" cy="44" r="19" fill="#d0a17c"/><path d="M44 70h58l5 60H39Z" fill="#625484"/><path d="m40 78-24 18 12 47 21-20Zm64 0 24 18-12 47-21-20Z" fill="#9c89c4"/><path d="M44 128h21l-6 66H34Zm32 0h20l12 66H82Z" fill="#392f4f"/><circle cx="72" cy="101" r="15" fill="none" stroke="#d9c8ff" stroke-width="4"/><path d="M72 86v30M57 101h30" stroke="#d9c8ff" stroke-width="3"/></svg>`;case'wave':return `<svg class="char" viewBox="0 0 150 210"><path d="M72 9C90 24 104 46 108 77v42c0 21-10 38-32 57-22-19-33-36-33-57V77C47 46 56 25 72 9Z" fill="#aeb8c6" stroke="#2f3946" stroke-width="4"/><ellipse cx="76" cy="64" rx="21" ry="25" fill="#79c8e7"/><path d="m44 105-26 23 27 8Zm64 0 27 23-27 8Z" fill="#526175"/><path d="m66 178 9 26 9-26Z" fill="#f3b24a"/></svg>`;case'spark':return `<svg class="char" viewBox="0 0 150 220"><path d="m44 38-19-27 30 15L73 8l18 18 32-15-20 28-5 23H48Z" fill="#f6c84b" stroke="#362d24" stroke-width="4"/><circle cx="74" cy="52" r="25" fill="#f2d6a3"/><circle cx="65" cy="50" r="5"/><circle cx="84" cy="50" r="5"/><path d="M65 63q9 7 19 0" stroke="#6b4430" stroke-width="3" fill="none"/><path d="m49 80 25-12 27 12-5 52H51Z" fill="#222630" stroke="#d6a929" stroke-width="4"/><path d="m47 87-27 16 11 40 24-15Zm55 0 27 16-11 40-24-15Z" fill="#f0c33e"/><path d="M53 130h16l-5 60H42Zm26 0h16l10 60H82Z" fill="#252a35"/><path d="m101 126 29-10-14 27 23 8-28 13 15 22-30-11" fill="#ffd84d" stroke="#9b7614" stroke-width="4"/></svg>`;case'legend':return `<svg class="char" viewBox="0 0 145 220"><path d="m41 34 10-23h41l10 23-7 30H48Z" fill="#d9dde3" stroke="#626b75" stroke-width="4"/><path d="M51 38h41l4 12-9 9H56l-9-9Z" fill="#98a1aa"/><rect x="59" y="43" width="27" height="5" rx="2" fill="#e5fbff"/><path d="m41 68 31-11 32 11-7 63H47Z" fill="#d9a51c"/><path d="m41 77-25 20 11 48 24-21Zm62 0 26 20-11 48-24-21Z" fill="#efc44d"/><path d="M48 129h19l-6 66H36Zm29 0h19l12 66H81Z" fill="#9e740f"/><circle cx="72" cy="99" r="11" fill="#fff5bd"/></svg>`;case'demon':return `<svg class="char" viewBox="0 0 155 225"><path d="M40 51 22 9l35 27L76 5l20 31 36-27-19 43-7 21H47Z" fill="#27090b" stroke="#701217" stroke-width="4"/><circle cx="77" cy="51" r="24" fill="#9d272d"/><circle cx="67" cy="48" r="4" fill="#ffd75a"/><circle cx="87" cy="48" r="4" fill="#ffd75a"/><path d="m42 76 35-13 36 13-7 69H48Z" fill="#5d1116"/><path d="m42 85-30 21 12 54 29-22Zm70 0 30 21-12 54-29-22Z" fill="#8c1e24"/><path d="M49 142h23l-7 66H36Zm33 0h23l14 66H89Z" fill="#341012"/><circle cx="77" cy="107" r="13" fill="#ff9d33"/></svg>`}return''}
function renderFighters(){$('fighterGrid').innerHTML='';Object.entries(fighters).filter(([,f])=>f.unlocked).forEach(([k,f])=>{const b=document.createElement('button');b.type='button';b.className='pick '+(k===selected?'selected':'');b.innerHTML=`<div class="art">${svg(f)}</div><div style="font-weight:800">${f.name}</div><div class="muted" style="font-size:.75rem">SPD ${f.speed} · J ${f.jab} · K ${f.kick} · S ${f.special}</div>`;b.addEventListener('click',()=>{selected=k;renderFighters()});$('fighterGrid').appendChild(b)})}
function renderLevels(){$('levelGrid').innerHTML='';Object.entries(levels).forEach(([k,l])=>{const b=document.createElement('button');b.type='button';b.className='level '+(k===selectedLevel?'selected':'');b.style.background=l.bg;b.innerHTML=`<div class="arena-copy"><div style="font-size:1.1rem;font-weight:900">${l.name}</div><div style="margin-top:4px;font-size:.76rem;font-weight:800">${l.rule||'STANDARD BATTLE'}</div><div style="margin-top:7px;font-size:.75rem">Speed ×${l.spd} · Damage ×${l.dmg} · Health ×${l.hp}</div></div>`;b.addEventListener('click',()=>{selectedLevel=k;startFight()});$('levelGrid').appendChild(b)})}
function renderMissions(){$('missionGrid').innerHTML='';missions.forEach(([k,label,type,goal])=>{const val=Math.min(stats[type]||0,goal);const c=document.createElement('div');c.className='card mission';c.innerHTML=`<div style="font-weight:800">${label}</div><div>Reward: ${fighters[k].name}</div><div class="muted" style="margin-top:6px;font-size:.75rem">${val} / ${goal}</div>`;$('missionGrid').appendChild(c)})}
function checkUnlocks(){const n=[];missions.forEach(([k,,type,goal])=>{if(!fighters[k].unlocked&&(stats[type]||0)>=goal){fighters[k].unlocked=true;n.push(fighters[k].name)}});const req=Object.entries(fighters).filter(([k])=>k!=='legend'&&k!=='demon');if(!fighters.legend.unlocked&&req.every(([,f])=>f.unlocked)){fighters.legend.unlocked=true;n.push('The Legend')}$('unlockCount').textContent=Object.values(fighters).filter(f=>f.unlocked).length+' / '+Object.keys(fighters).length;renderMissions();return n}
function randomPair(){const arr=Object.keys(fighters).filter(k=>fighters[k].unlocked);const a=arr[Math.floor(Math.random()*arr.length)];let b=a;while(b===a&&arr.length>1)b=arr[Math.floor(Math.random()*arr.length)];return[a,b]}
function startFight(){clearInterval(cpuTimer);clearInterval(countdown);const l=levels[selectedLevel];let leftKey=selected,rightKey;if(l.tv){[leftKey,rightKey]=randomPair()}else if(l.boss){rightKey=l.boss}else{const choices=Object.keys(fighters).filter(k=>fighters[k].unlocked&&k!==selected);rightKey=choices[Math.floor(Math.random()*choices.length)]||'nova'};root.classList.toggle('retro-on',!!l.retro);const max=l.rainbow?200:100;state={left:fighters[leftKey],right:fighters[rightKey],php:max,pmax:max,ehp:100*l.hp,emax:100*l.hp,px:10,ex:70,time:60,over:false,block:false,turn:'player',tvTurn:'left',level:l};$('player').querySelector('.body').innerHTML=svg(state.left);$('enemy').querySelector('.body').innerHTML=svg(state.right);$('pName').textContent=state.left.name;$('eName').textContent=state.right.name;$('leftLabel').textContent=l.tv?'CPU 1':'YOU';$('rightLabel').textContent=l.tv?'CPU 2':'CPU';$('fightLevel').textContent=l.name;$('arena').style.background=l.bg;$('ruleBanner').textContent=l.rule||'';$('ruleBanner').classList.toggle('hidden',!l.rule);$('controls').classList.toggle('hidden',!!l.tv);$('end').classList.add('hidden');$('unlockNotice').classList.add('hidden');$('msg').textContent=l.tv?'CPU VS CPU!':l.tag?'YOUR TURN!':l.sudden?'FIRST HIT WINS!':l.boss?'BOSS BATTLE!':'FIGHT!';show('fight');update();setTimeout(()=>{if(state&&!state.over)$('msg').textContent=''},700);countdown=setInterval(()=>{if(!state||state.over)return;state.time--;update();if(state.time<=0){const leftWins=state.php/state.pmax>state.ehp/state.emax;if(l.tv)finishTv(leftWins?'CPU 1 WINS!':'CPU 2 WINS!');else finish(leftWins?'YOU WIN!':'CPU WINS!',leftWins)}},1000);cpuTimer=setInterval(l.tv?tvTurn:cpuTurn,l.tv?430:l.tag?450:l.boss?540:620)}
function update(){if(!state)return;$('player').style.left=state.px+'%';$('enemy').style.left=state.ex+'%';$('pHP').style.width=clamp(state.php/state.pmax*100,0,100)+'%';$('eHP').style.width=clamp(state.ehp/state.emax*100,0,100)+'%';$('timer').textContent=state.time}
function dist(){return Math.abs(state.ex-state.px)}
function attack(type){if(!state||state.over||state.level.tv)return;if(state.level.tag&&state.turn!=='player')return;const range={jab:17,kick:22,special:40}[type];if(type==='special')stats.specials++;if(dist()>range){if(state.level.tag)state.turn='cpu';return}stats.hits++;if(type==='kick')stats.kicks++;$('enemy').classList.add('hit');setTimeout(()=>$('enemy').classList.remove('hit'),130);if(state.level.sudden){state.ehp=0;update();finish('FIRST HIT — YOU WIN!',true);return}state.ehp-=state.left[type]*(state.level.rainbow?.5:1);update();if(state.ehp<=0){finish(state.level.boss?'BOSS DEFEATED!':'K.O. — YOU WIN!',true);return}if(state.level.tag)state.turn='cpu';checkUnlocks()}
function cpuTurn(){if(!state||state.over)return;const l=state.level;if(l.tag&&state.turn!=='cpu')return;if(dist()>19){state.ex+=state.ex>state.px?-(state.right.speed*l.spd):(state.right.speed*l.spd);state.ex=clamp(state.ex,7,84);update();return}if(l.sudden){if(state.block)return;state.php=0;update();finish('FIRST HIT — CPU WINS!',false);return}let dmg=(Math.random()<.55?state.right.jab:state.right.kick)*l.dmg*.72;if(state.block)dmg*=.25;state.php-=dmg;$('player').classList.add('hit');setTimeout(()=>$('player').classList.remove('hit'),130);update();if(state.php<=0){finish(l.boss?'BOSS WINS!':'K.O. — CPU WINS!',false);return}if(l.tag)state.turn='player'}
function tvTurn(){if(!state||state.over)return;if(dist()>19){if(state.tvTurn==='left')state.px=clamp(state.px+state.left.speed*.6*state.level.spd,4,88);else state.ex=clamp(state.ex-state.right.speed*.6*state.level.spd,4,88);state.tvTurn=state.tvTurn==='left'?'right':'left';update();return}if(state.tvTurn==='left'){const t=Math.random()<.2?'special':Math.random()<.55?'jab':'kick';state.ehp-=state.left[t]*state.level.dmg;if(state.ehp<=0){update();finishTv('CPU 1 WINS!');return}state.tvTurn='right'}else{const t=Math.random()<.2?'special':Math.random()<.55?'jab':'kick';state.php-=state.right[t]*state.level.dmg;if(state.php<=0){update();finishTv('CPU 2 WINS!');return}state.tvTurn='left'}update()}
function move(d){if(!state||state.over||state.level.tv)return;state.px=clamp(state.px+d*state.left.speed*state.level.spd,4,88);update()}
function jump(){if(!state||state.over||state.level.tv)return;$('player').style.bottom='43%';setTimeout(()=>{if(state)$('player').style.bottom='18%'},320)}
function block(v){if(!state||state.over||state.level.tv)return;state.block=v;$('player').classList.toggle('block',v)}
function finish(text,won){if(!state||state.over)return;state.over=true;clearInterval(cpuTimer);clearInterval(countdown);stats.fights++;if(won)stats.wins++;const u=checkUnlocks();$('msg').textContent=text;$('endTitle').textContent=text;$('end').classList.remove('hidden');if(u.length){$('unlockNotice').textContent='Unlocked: '+u.join(', ');$('unlockNotice').classList.remove('hidden')}}
function finishTv(text){if(!state||state.over)return;state.over=true;clearInterval(cpuTimer);clearInterval(countdown);$('msg').textContent=text;$('endTitle').textContent=text;$('end').classList.remove('hidden')}
function leave(dest){clearInterval(cpuTimer);clearInterval(countdown);state=null;root.classList.remove('retro-on');$('controls').classList.remove('hidden');show(dest)}
$('playBtn').addEventListener('click',()=>{renderFighters();show('select')});$('missionsBtn').addEventListener('click',()=>{renderMissions();show('missions')});root.querySelectorAll('.toMenu').forEach(b=>b.addEventListener('click',()=>show('menu')));$('levelsBtn').addEventListener('click',()=>{renderLevels();show('map')});$('backFighter').addEventListener('click',()=>show('select'));$('rematch').addEventListener('click',startFight);$('changeLevel').addEventListener('click',()=>{leave('map');renderLevels()});$('fightMenu').addEventListener('click',()=>leave('menu'));$('left').addEventListener('click',()=>move(-1));$('right').addEventListener('click',()=>move(1));$('jump').addEventListener('click',jump);$('jab').addEventListener('click',()=>attack('jab'));$('kick').addEventListener('click',()=>attack('kick'));$('special').addEventListener('click',()=>attack('special'));$('block').addEventListener('pointerdown',()=>block(true));$('block').addEventListener('pointerup',()=>block(false));$('block').addEventListener('pointerleave',()=>block(false));root.addEventListener('keydown',e=>{if(!state||!root.contains(document.activeElement))return;const k=e.key.toLowerCase();if(k==='arrowleft')move(-1);else if(k==='arrowright')move(1);else if(k==='arrowup')jump();else if(k==='arrowdown'||k==='s')block(true);else if(k==='j')attack('jab');else if(k==='k')attack('kick');else if(k==='l')attack('special')});root.addEventListener('keyup',e=>{if(['arrowdown','s'].includes(e.key.toLowerCase()))block(false)});checkUnlocks();
})();
</script>
