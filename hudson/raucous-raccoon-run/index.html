<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10212e"><title>Raucous Raccoon Run</title><link rel="stylesheet" href="style.css"></head>
<body><main id="app"><header><h1>RAUCOUS<br>RACCOON RUN</h1><div class="bank"><div id="wallet">SCRAPS: 0</div><div id="best">BEST: 0</div></div></header><div class="game-frame"><canvas id="game" width="360" height="520" aria-label="Three-lane raccoon running game"></canvas><div id="hud" hidden><span id="score">0 SCRAPS</span><span id="hearts">♥♥♥</span><span id="distance">0m</span></div><button id="pause" class="pause" hidden aria-label="Pause game">Ⅱ</button><div id="speed" hidden><div class="speed-line"><span id="level">SPEED LEVEL 1</span><span id="mult">1.0×</span></div><div class="track"><div id="bar"></div></div></div><div id="overlay"><h2 id="screen-title">RAUCOUS<br>RACCOON RUN</h2><div id="panel"></div></div></div><div class="controls"><button id="left" aria-label="Move left">◀</button><span>MOVE<br>← A | D →</span><button id="right" aria-label="Move right">▶</button></div><div class="settings"><label><input id="music" type="checkbox" checked> Music</label><label><input id="sfx" type="checkbox" checked> Sound effects</label></div><p class="help">Trash cans: +3–5 scraps · Dumpsters: +7–10 scraps<br>Run beside them, not into them!</p></main><script src="game.js" defer></script></body></html>
