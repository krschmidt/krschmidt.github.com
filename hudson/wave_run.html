<title>Wave Run</title>

  html,body{margin:0;height:100%;background:#070b13;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
  #wrap{height:100%;display:grid;place-items:center}
  canvas{background:#0f172a;border:2px solid #ffffff22;box-shadow:0 0 40px #000a;max-width:100vw;max-height:100vh;touch-action:none}
  #help{position:fixed;left:12px;bottom:10px;font-size:13px;opacity:.72;pointer-events:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1000" height="560"></canvas></div>
<div id="help">Menu: click/tap buttons • Game: hold to go up, release to go down • Ball: tap to jump • Esc = menu • R = restart</div>

let ownedPasses=JSON.parse(localStorage.getItem('waveOwnedPasses')||'[]');

// Save-data migration: merge unlocks from older Wave Run builds instead of resetting them.
const legacyOwnedKeys=[
  'waveOwnedIcons',
  'waveOwnedCharacters',
  'waveShopOwned',
  'ownedIcons'
];
for(const key of legacyOwnedKeys){
  try{
    const data=JSON.parse(localStorage.getItem(key)||'[]');
    if(Array.isArray(data)){
      for(const id of data) if(typeof id==='string' && !owned.includes(id)) owned.push(id);
    }
  }catch(e){}
}

const legacyChestKeys=[
  'waveChestOwned',
  'waveChestCharacters',
  'chestOwnedCharacters'
];
for(const key of legacyChestKeys){
  try{
    const data=JSON.parse(localStorage.getItem(key)||'[]');
    if(Array.isArray(data)){
      for(const id of data) if(typeof id==='string' && !chestOwned.includes(id)) chestOwned.push(id);
    }
  }catch(e){}
}

// If an old selected chest character exists, keep it equipped.
const legacyEquippedChest =
  localStorage.getItem('waveChestEquipped') ||
  localStorage.getItem('waveSelectedChestCharacter') ||
  '';
if(legacyEquippedChest && chestOwned.includes(legacyEquippedChest)){
  chestEquipped=legacyEquippedChest;
}

// Ensure the default wave is never lost.
if(!owned.includes('wave')) owned.unshift('wave');

function getShopEntries(){
  const entries=[
    ...icons.map(item=>({kind:'icon',item})),
    ...chestCharacters.map(item=>({kind:'chest',item}))
  ];

  const idx=entries.findIndex(e=>e && e.kind==='icon' && e.item && e.item.id==='collector50');
  if(idx>=0){
    const collector=entries.splice(idx,1)[0];
    entries.splice(Math.min(53,entries.length),0,collector);
  }

  return entries;
}





function saveShop(){
 localStorage.setItem('waveShopPoints',points);
 localStorage.setItem('waveLifetimePoints',lifetimePoints);
 localStorage.setItem('waveOwnedIcons',JSON.stringify(owned));
 localStorage.setItem('waveChestOwned',JSON.stringify(chestOwned));
 localStorage.setItem('waveSelectedIcon',selected);
 localStorage.setItem('waveTotalRuns',totalRuns);
 localStorage.setItem('waveTotalScore',totalScore);
 localStorage.setItem('waveMissionUnlocked',JSON.stringify(missionUnlocked));
 localStorage.setItem('waveOwnedPasses',JSON.stringify(ownedPasses));
 localStorage.setItem('waveChestOwned',JSON.stringify(chestOwned));
 localStorage.setItem('waveChestEquipped',chestEquipped);
}

function getOwnedCharacterCount(){
 const ids=new Set();
 for(const id of owned) ids.add(id);
 for(const id of chestOwned) ids.add(id);
 return ids.size;
}

function checkMissions(){
 for(const m of missions){
   if(m.check() && !missionUnlocked.includes(m.id)){
     missionUnlocked.push(m.id);
     if(!owned.includes(m.reward)) owned.push(m.reward);
   }
 }
 saveShop();
}

function reset(){
  player={x:160,y:H/2,vy:0,rot:0,r:15,onSurface:false};
  obstacles=[];portals=[];particles=[];
  holding=false;started=false;dead=false;
  score=0;speed=5.6;distance=0;lastSpawn=0;spawnGap=290;bgShift=0;
  mode='wave';portalTimer=0;runPoints=0;
}
reset();

function startGame(){
 reset();
 screen='game';
 started=false;
}

function goMenu(){
 if(screen==='game' && started && !dead){
   points += runPoints;lifetimePoints += runPoints;
   runPoints=0;
   saveShop();
 }
 screen='menu';
 holding=false;
}

function press(){
 if(screen!=='game') return;
 if(dead){
   points += runPoints;lifetimePoints += runPoints;
   saveShop();
   reset();
   started=true;
 }else started=true;
 holding=true;

}
function release(){holding=false;}

addEventListener('keydown',e=>{
 if(e.code==='Escape'){goMenu();return;}
 if(screen==='game'){
   if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)press();}
   if(e.code==='KeyR'){points+=runPoints;lifetimePoints+=runPoints;saveShop();reset();started=true;}
 }
});
addEventListener('keyup',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code))release();});

c.addEventListener('pointerdown',e=>{
 const r=c.getBoundingClientRect();
 const x=(e.clientX-r.left)*(W/r.width), y=(e.clientY-r.top)*(H/r.height);

 if(screen==='menu'){
   if(hitButton(x,y,350,220,300,70)) startGame();
   else if(hitButton(x,y,350,300,300,60)) screen='shop';
   else if(hitButton(x,y,350,375,300,60)) screen='passes';
   else if(hitButton(x,y,350,450,300,60)) screen='chests';
   else if(hitButton(x,y,350,520,300,35)) screen='missions';
 }else if(screen==='shop'){
   if(hitButton(x,y,30,30,130,50)){screen='menu';return;}

   const shopEntries=getShopEntries();
   const maxShopPage=Math.max(0,Math.ceil(shopEntries.length/6)-1);
   shopPage=Math.max(0,Math.min(shopPage,maxShopPage));

   if(hitButton(x,y,730,30,110,50)){
     if(shopPage>0) shopPage--;
     return;
   }

   if(hitButton(x,y,850,30,110,50)){
     if(shopPage<maxShopPage) shopPage++;
     return;
   }

   const shown=shopEntries.slice(shopPage*6,shopPage*6+6);

   for(let j=0;j<shown.length;j++){
     const entry=shown[j];
     const item=entry.item;
     const col=j%3,row=Math.floor(j/3);
     const bx=120+col*270,by=150+row*170;

     if(hitButton(x,y,bx,by,220,130)){
       if(entry.kind==='chest'){
         if(chestOwned.includes(item.id)){
           chestEquipped=item.id;
           saveShop();
         }
       }else{
         if(owned.includes(item.id)){
           selected=item.id;
           chestEquipped='';
           saveShop();
         }else if(item.source==='shop' && points>=item.price){
           points-=item.price;
           owned.push(item.id);
           selected=item.id;
           chestEquipped='';
           saveShop();
         }
       }
       return;
     }
   }
 }else if(screen==='passes'){
   if(hitButton(x,y,30,30,130,50)){screen='menu';return;}

   const maxPassPage=Math.max(0,Math.ceil(seasonalPasses.length/3)-1);

   if(hitButton(x,y,730,30,110,50)){
     passPage=Math.max(0,passPage-1);
     return;
   }

   if(hitButton(x,y,850,30,110,50)){
     passPage=Math.min(maxPassPage,passPage+1);
     return;
   }

   const shown=seasonalPasses.slice(passPage*3,passPage*3+3);

   for(let i=0;i<shown.length;i++){
     const p=shown[i];
     const py=135+i*130;

     if(hitButton(x,y,130,py,740,108)){
       if(!ownedPasses.includes(p.id) && points>=500){
         points-=500;
         ownedPasses.push(p.id);

         for(const skin of p.skins){
           if(icons.some(v=>v && v.id===skin) && !owned.includes(skin)){
             owned.push(skin);
           }
         }

         saveShop();
       }
       return;
     }
   }
 }else if(screen==='chests'){
   if(hitButton(x,y,30,30,130,50)){screen='menu';return;}

   if(hitButton(x,y,350,170,300,65)){
     const available=chestCharacters.filter(ch=>!chestOwned.includes(ch.id));
     if(points<100){
       chestMessage='You need 100 points to open a chest.';
     }else if(available.length===0){
       chestMessage='You already have every chest character!';
     }else{
       points-=100;
       const reward=available[Math.floor(Math.random()*available.length)];
       chestOwned.push(reward.id);
       chestEquipped=reward.id;
       chestMessage=`Unlocked ${reward.name}! It is now equipped.`;
       saveShop();
     }
     return;
   }

   const visible=chestCharacters.filter(ch=>chestOwned.includes(ch.id)).slice(chestPage*4,chestPage*4+4);
   for(let i=0;i<visible.length;i++){
     const bx=150+(i%2)*360, by=300+Math.floor(i/2)*90;
     if(hitButton(x,y,bx,by,300,65)){
       chestEquipped=visible[i].id;
       chestMessage=`Equipped ${visible[i].name}.`;
       saveShop();
       return;
     }
   }

   if(hitButton(x,y,730,30,110,50)){chestPage=Math.max(0,chestPage-1);return;}
   if(hitButton(x,y,850,30,110,50)){
     const maxChestPage=Math.max(0,Math.ceil(chestOwned.length/4)-1);
     chestPage=Math.min(maxChestPage,chestPage+1);
     return;
   }
 }else if(screen==='missions'){
   if(hitButton(x,y,30,30,130,50)){screen='menu';return;}
 }else{
   press();
 }
});
addEventListener('pointerup',release);
addEventListener('pointercancel',release);

function hitButton(x,y,bx,by,bw,bh){return x>=bx&&x<=bx+bw&&y>=by&&y<=by+bh;}

function spawnObstacle(){
 let difficulty=Math.min(1,score/1400);
 if(Math.random()<0.38){
   let fromFloor=Math.random()<0.5;
   let h=70+Math.random()*130;
   obstacles.push({x:W+60,w:100+Math.random()*150,rideable:true,fromFloor,y:fromFloor?floorY-h:ceilY,h,passed:false});
 }else{
   let gap=200-65*difficulty,center=170+Math.random()*220,width=58+Math.random()*28;
   obstacles.push({x:W+60,w:width,gapTop:center-gap/2,gapBottom:center+gap/2,passed:false,rideable:false});
 }
 // Wave-only mode: no ball-mode portals.
 lastSpawn=distance;
 spawnGap=280-Math.min(85,score/9)+Math.random()*110;
}

function hitRectCircle(cx,cy,r,rx,ry,rw,rh){
 const nx=Math.max(rx,Math.min(cx,rx+rw)),ny=Math.max(ry,Math.min(cy,ry+rh));
 let dx=cx-nx,dy=cy-ny;return dx*dx+dy*dy<r*r;
}

function crash(){
 if(dead)return;
 dead=true;
 best=Math.max(best,score);
 totalRuns++;
 totalScore+=score;
 localStorage.setItem('endlessPortalBest',best);
 checkMissions();
 for(let i=0;i<28;i++)particles.push({x:player.x,y:player.y,vx:(Math.random()-.5)*9,vy:(Math.random()-.5)*9,life:30+Math.random()*25});
}

function switchMode(target){
 mode=target;player.vy=0;player.onSurface=false;
 player.y=Math.max(ceilY+35,Math.min(floorY-35,player.y));
}

function updatePlayer(){
 player.onSurface=false;
 player.vy=holding?-6.2:6.2;
 player.y+=player.vy;
 player.rot=holding?-0.55:0.55;
}

function resolveRideable(o){
 const r=player.r,px=player.x,py=player.y,top=o.y,bottom=o.y+o.h;
 const overlapsX=px+r>o.x&&px-r<o.x+o.w;
 if(o.fromFloor){
   const feet=py+r;
   const canRide=overlapsX&&feet>=top-12&&feet<=top+30&&mode!=='wave'&&player.vy>=0;
   if(canRide){player.y=top-r;player.vy=0;player.onSurface=true;return;}
   if(hitRectCircle(px,py,r,o.x,o.y+16,o.w,Math.max(0,o.h-16)))crash();
 }else{
   const head=py-r;
   const canRide=overlapsX&&head<=bottom+12&&head>=bottom-30&&mode!=='wave'&&player.vy<=0;
   if(canRide){player.y=bottom+r;player.vy=0;player.onSurface=true;return;}
   if(hitRectCircle(px,py,r,o.x,o.y,o.w,Math.max(0,o.h-16)))crash();

function update(){
 if(screen!=='game')return;
 if(dead){
   for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.life--;}
   particles=particles.filter(p=>p.life>0);
   return;
 }
 if(!started)return;

 speed=Math.min(11.7,5.6+score/280);
 bgShift=(bgShift+speed*.25)%80;
 distance+=speed;
 score=Math.floor(distance/18);
 runPoints=score;
 portalTimer=Math.max(0,portalTimer-speed);

 updatePlayer();
 if(distance-lastSpawn>spawnGap)spawnObstacle();

 for(const o of obstacles){
   o.x-=speed;
   if(!o.passed&&o.x+o.w<player.x)o.passed=true;
   if(o.rideable)resolveRideable(o);
   else if(hitRectCircle(player.x,player.y,player.r,o.x,ceilY,o.w,o.gapTop-ceilY)||
           hitRectCircle(player.x,player.y,player.r,o.x,o.gapBottom,o.w,floorY-o.gapBottom))crash();
 }
 obstacles=obstacles.filter(o=>o.x>-140);

 for(const p of portals){
   p.x-=speed;
   if(!p.used&&Math.abs(p.x-player.x)<24&&Math.abs(p.y-player.y)<110){p.used=true;switchMode(p.target);}
 }
 portals=portals.filter(p=>p.x>-100);

 if(player.y+player.r>=floorY) crash();
 if(player.y-player.r<=ceilY) crash();
}

function bg(){

 for(let x=-bgShift;x<W;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
 for(let y=20;y<H;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
 ctx.globalAlpha=1;
}

function drawShopPreview(entry,x,y,isOwned){
 const item=entry && entry.item ? entry.item : null;
 if(!item) return;

 ctx.save();
 ctx.translate(x,y);

 // Dedicated previews for page 9 so every slot is guaranteed visible.
 if(item.id==='planet'){
   ctx.fillStyle='#60a5fa';
   ctx.beginPath();ctx.arc(0,0,15,0,Math.PI*2);ctx.fill();
   ctx.strokeStyle='#c084fc';ctx.lineWidth=4;
   ctx.beginPath();ctx.ellipse(0,0,24,8,.35,0,Math.PI*2);ctx.stroke();
   ctx.restore();return;
 }
 if(item.id==='ufo'){
   ctx.fillStyle='#94a3b8';
   ctx.beginPath();ctx.ellipse(0,5,20,8,0,0,Math.PI*2);ctx.fill();
   ctx.fillStyle='#67e8f9';
   ctx.beginPath();ctx.arc(0,0,10,Math.PI,0);ctx.lineTo(10,3);ctx.lineTo(-10,3);ctx.closePath();ctx.fill();
   ctx.restore();return;
 }
 if(item.id==='comet'){
   ctx.strokeStyle='#f59e0b';ctx.lineWidth=6;
   ctx.beginPath();ctx.moveTo(-22,12);ctx.lineTo(3,-3);ctx.stroke();
   ctx.fillStyle='#fde68a';
   ctx.beginPath();ctx.arc(10,-8,10,0,Math.PI*2);ctx.fill();
   ctx.restore();return;
 }
 if(item.id==='satellite'){
   ctx.fillStyle='#94a3b8';ctx.fillRect(-7,-7,14,14);
   ctx.fillStyle='#3b82f6';ctx.fillRect(-25,-9,16,18);ctx.fillRect(9,-9,16,18);
   ctx.strokeStyle='#e2e8f0';ctx.lineWidth=2;
   ctx.beginPath();ctx.moveTo(0,-7);ctx.lineTo(0,-18);ctx.stroke();
   ctx.restore();return;
 }
 if(item.id==='galaxy'){
   ctx.strokeStyle='#c084fc';ctx.lineWidth=5;
   ctx.beginPath();ctx.arc(0,0,16,.2,Math.PI*1.7);ctx.stroke();
   ctx.strokeStyle='#60a5fa';ctx.lineWidth=3;
   ctx.beginPath();ctx.arc(0,0,10,Math.PI*.8,Math.PI*2.2);ctx.stroke();
   ctx.fillStyle='#fff';
   ctx.beginPath();ctx.arc(0,0,4,0,Math.PI*2);ctx.fill();
   ctx.restore();return;
 }
 if(item.id==='burger'){
   ctx.fillStyle='#f59e0b';
   ctx.beginPath();ctx.arc(0,-6,18,Math.PI,0);ctx.lineTo(18,0);ctx.lineTo(-18,0);ctx.closePath();ctx.fill();
   ctx.fillStyle='#22c55e';ctx.fillRect(-17,0,34,5);
   ctx.fillStyle='#7c2d12';ctx.fillRect(-16,5,32,8);
   ctx.fillStyle='#facc15';ctx.fillRect(-15,13,30,4);
   ctx.restore();return;
 }

 ctx.restore();

 try{
   if(entry.kind==='chest'){
     if(isOwned){
       drawChestCharacter(item.id,x,y,1.2,0);
     }else{
       ctx.save();
       ctx.translate(x,y);
       ctx.fillStyle='#020617';
       ctx.beginPath();ctx.arc(0,0,18,0,Math.PI*2);ctx.fill();
       ctx.fillStyle='#475569';

       ctx.textAlign='center';
       ctx.fillText('?',0,8);
       ctx.restore();
     }

     drawIcon(item.shape,x,y,1.2,0);

 }catch(err){
   ctx.save();
   ctx.translate(x,y);
   ctx.fillStyle='#334155';
   ctx.beginPath();ctx.arc(0,0,18,0,Math.PI*2);ctx.fill();
   ctx.fillStyle='#fff';
   ctx.font='900 20px system-ui';
   ctx.textAlign='center';
   ctx.fillText('!',0,7);
   ctx.restore();
 }
}

function drawShop(){
 bg();
 button(30,30,130,50,'BACK');

 ctx.fillStyle='#fff';
 ctx.font='900 42px system-ui';
 ctx.textAlign='center';
 ctx.fillText('ICON SHOP',W/2,82);

 ctx.font='18px system-ui';
 ctx.fillStyle='#facc15';
 ctx.fillText(`Points: ${points}`,W/2,115);
 ctx.textAlign='left';

 const shopEntries=getShopEntries();
 const maxPage=Math.max(0,Math.ceil(shopEntries.length/6)-1);
 shopPage=Math.max(0,Math.min(shopPage,maxPage));

 // PREV button
 if(shopPage>0){
   button(730,30,110,50,'PREV');
 }else{
   ctx.fillStyle='#111827';ctx.fillRect(730,30,110,50);
   ctx.strokeStyle='#334155';ctx.lineWidth=2;ctx.strokeRect(730,30,110,50);
   ctx.fillStyle='#475569';ctx.font='800 18px system-ui';ctx.textAlign='center';ctx.fillText('PREV',785,62);ctx.textAlign='left';
 }

 // NEXT button
 if(shopPage<maxPage){
   button(850,30,110,50,'NEXT');
 }else{
   ctx.fillStyle='#111827';ctx.fillRect(850,30,110,50);
   ctx.strokeStyle='#334155';ctx.lineWidth=2;ctx.strokeRect(850,30,110,50);
   ctx.fillStyle='#475569';ctx.font='800 18px system-ui';ctx.textAlign='center';ctx.fillText('NEXT',905,62);ctx.textAlign='left';
 }

 const shown=shopEntries.slice(shopPage*6,shopPage*6+6);

 for(let j=0;j<shown.length;j++){
   const entry=shown[j];
   if(!entry || !entry.item) continue;
   const item=entry.item;
   const col=j%3,row=Math.floor(j/3);
   const x=120+col*270,y=150+row*170;

   const isChest=entry.kind==='chest';
   const isOwned=isChest ? chestOwned.includes(item.id) : owned.includes(item.id);
   const isSelected=isChest ? chestEquipped===item.id : selected===item.id;

   ctx.fillStyle=isSelected?'#1d4ed8':isOwned?'#172033':'#111827';
   ctx.fillRect(x,y,220,130);

   ctx.strokeStyle=isSelected?'#bfdbfe':isOwned?'#475569':'#334155';
   ctx.lineWidth=3;
   ctx.strokeRect(x,y,220,130);

   drawShopPreview(entry,x+110,y+42,isOwned);

   ctx.textAlign='center';

   if(isChest && !isOwned){
     ctx.fillStyle='#64748b';
     ctx.font='800 17px system-ui';
     ctx.fillText('???',x+110,y+82);

     ctx.font='15px system-ui';
     ctx.fillStyle='#c084fc';
     ctx.fillText('UNLOCK FROM CHEST',x+110,y+108);
   }else{
     ctx.fillStyle='#fff';
     ctx.font='700 17px system-ui';
     ctx.fillText(item.name,x+110,y+82);

     ctx.font='15px system-ui';

     if(isChest){
       ctx.fillStyle=isSelected?'#bfdbfe':'#86efac';
       ctx.fillText(isSelected?'SELECTED':'OWNED - TAP TO SELECT',x+110,y+108);
     }else{
       ctx.fillStyle=isSelected?'#bfdbfe':isOwned?'#86efac':(item.source==='mission'||item.source==='pass')?'#c084fc':'#facc15';
       ctx.fillText(
         isSelected?'SELECTED':
         isOwned?'OWNED - TAP TO SELECT':
         item.source==='mission'?'MISSION REWARD':
         item.source==='pass'?'SEASON PASS':
         `${item.price} POINTS`,
         x+110,y+108
       );
     }
   }

   ctx.textAlign='left';
 }

 ctx.textAlign='center';
 ctx.fillStyle='#94a3b8';
 ctx.font='15px system-ui';
 ctx.fillText(`Page ${shopPage+1} of ${maxPage+1}`,W/2,525);
 ctx.textAlign='left';
}

   ctx.font='800 18px system-ui';
   ctx.fillText(has?'OWNED':'500 POINTS',845,y+47);

   ctx.font='13px system-ui';
   ctx.fillStyle=has?'#86efac':'#cbd5e1';
   ctx.fillText(has?'Unlocked':'Tap this card to buy',845,y+76);
 }

 ctx.textAlign='center';
 ctx.fillStyle='#94a3b8';
 ctx.font='14px system-ui';
 ctx.fillText(`Page ${passPage+1} of ${maxPage+1}`,W/2,545);
 ctx.textAlign='left';
}

function drawChests(){
 bg();

 button(30,30,130,50,'BACK');
 button(730,30,110,50,'PREV');
 button(850,30,110,50,'NEXT');

 ctx.textAlign='center';
 ctx.fillStyle='#fff';
 ctx.font='900 42px system-ui';
 ctx.fillText('CHARACTER CHESTS',W/2,85);

 ctx.font='18px system-ui';
 ctx.fillStyle='#facc15';
 ctx.fillText(`Points: ${points}`,W/2,118);

 button(350,170,300,65,'OPEN CHEST - 100');

 ctx.font='16px system-ui';
 ctx.fillStyle='#cbd5e1';
 ctx.fillText(chestMessage,W/2,260);

 const allOwned=chestCharacters.filter(ch=>chestOwned.includes(ch.id));
 const maxPage=Math.max(0,Math.ceil(allOwned.length/4)-1);
 chestPage=Math.max(0,Math.min(chestPage,maxPage));
 const visible=allOwned.slice(chestPage*4,chestPage*4+4);

 ctx.textAlign='left';
 for(let i=0;i<visible.length;i++){
   const ch=visible[i];
   const bx=150+(i%2)*360, by=300+Math.floor(i/2)*90;
   const equipped=chestEquipped===ch.id;

   ctx.fillStyle=equipped?'#16351f':'#172033';
   ctx.fillRect(bx,by,300,65);
   ctx.strokeStyle=equipped?'#4ade80':'#64748b';
   ctx.lineWidth=2;
   ctx.strokeRect(bx,by,300,65);

   drawChestCharacter(ch.id,bx+38,by+32,.8,0);

   ctx.fillStyle='#fff';
   ctx.font='800 18px system-ui';
   ctx.fillText(ch.name,bx+70,by+28);

   ctx.fillStyle=equipped?'#86efac':'#94a3b8';
   ctx.font='14px system-ui';
   ctx.fillText(equipped?'EQUIPPED':'Tap to equip',bx+70,by+50);
 }

 ctx.textAlign='center';
 ctx.fillStyle='#94a3b8';
 ctx.font='14px system-ui';
 ctx.fillText(`Chest collection: ${allOwned.length}/${chestCharacters.length} • Page ${chestPage+1} of ${maxPage+1}`,W/2,530);
 ctx.fillText('Chest characters are hidden from the Icon Shop.',W/2,550);
 ctx.textAlign='left';
}

function drawMissions(){
 bg();
 button(30,30,130,50,'BACK');

 ctx.fillStyle='#fff';
 ctx.font='900 40px system-ui';
 ctx.textAlign='center';
 ctx.fillText('MISSIONS',W/2,62);

 ctx.font='15px system-ui';
 ctx.fillStyle='#cbd5e1';
 ctx.fillText(`Runs: ${totalRuns} • Total Score: ${totalScore} • Lifetime Points: ${lifetimePoints}`,W/2,90);

 ctx.textAlign='left';

 for(let i=0;i<missions.length;i++){
   const m=missions[i];
   const col=i<5?0:1;
   const row=i%5;
   const x=40+col*490;
   const y=115+row*82;
   const w=430;
   const h=68;
   const complete=missionUnlocked.includes(m.id);
   const reward=icons.find(v=>v && v.id===m.reward);

   ctx.fillStyle=complete?'#16351f':'#172033';
   ctx.fillRect(x,y,w,h);

   ctx.strokeStyle=complete?'#4ade80':'#475569';
   ctx.lineWidth=2;
   ctx.strokeRect(x,y,w,h);

   if(reward && reward.shape){
     try{
       drawIcon(reward.shape,x+32,y+34,.75,0);
     }catch(err){
       ctx.fillStyle='#475569';
       ctx.beginPath();ctx.arc(x+32,y+34,13,0,Math.PI*2);ctx.fill();
     }
   }

   ctx.fillStyle='#fff';
   ctx.font='700 16px system-ui';
   ctx.fillText(m.name,x+62,y+24);

   ctx.fillStyle='#cbd5e1';
   ctx.font='13px system-ui';
   ctx.fillText(m.desc,x+62,y+45);

   ctx.textAlign='right';
   ctx.font='700 12px system-ui';
   ctx.fillStyle=complete?'#86efac':'#c084fc';
   ctx.fillText(complete?'UNLOCKED':`Reward: ${reward?reward.name:'Unknown'}`,x+w-12,y+61);
   ctx.textAlign='left';
 }

 // Make Point Master unmistakable if present.
 const pm=missions.find(m=>m.id==='points10000');
 if(pm){
   ctx.textAlign='center';
   ctx.fillStyle='#facc15';
   ctx.font='700 14px system-ui';
   ctx.fillText(`Point Master progress: ${lifetimePoints.toLocaleString()} / 10,001 lifetime points`,W/2,548);
   ctx.textAlign='left';
 }
}

function drawGame(){
 bg();
 ctx.fillStyle='#172033';ctx.fillRect(0,0,W,ceilY);ctx.fillRect(0,floorY,W,H-floorY);
 ctx.fillStyle='#38bdf8';ctx.fillRect(0,ceilY,W,5);ctx.fillRect(0,floorY-5,W,5);

 for(const o of obstacles){
   if(o.rideable){
     let grad=ctx.createLinearGradient(o.x,0,o.x+o.w,0);grad.addColorStop(0,'#38bdf8');grad.addColorStop(1,'#2563eb');
     ctx.fillStyle=grad;ctx.fillRect(o.x,o.y,o.w,o.h);ctx.fillStyle='#bae6fd';
     if(o.fromFloor)ctx.fillRect(o.x-3,o.y-7,o.w+6,7);else ctx.fillRect(o.x-3,o.y+o.h,o.w+6,7);
   }else{
     let grad=ctx.createLinearGradient(o.x,0,o.x+o.w,0);grad.addColorStop(0,'#fb7185');grad.addColorStop(1,'#f43f5e');
     ctx.fillStyle=grad;ctx.fillRect(o.x,ceilY,o.w,o.gapTop-ceilY);ctx.fillRect(o.x,o.gapBottom,o.w,floorY-o.gapBottom);
     ctx.fillStyle='#fecdd3';ctx.fillRect(o.x-4,o.gapTop-8,o.w+8,8);ctx.fillRect(o.x-4,o.gapBottom,o.w+8,8);
   }
 }
 for(const p of portals)drawPortal(p);
 if(!dead)drawPlayer();

 for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/55);ctx.fillStyle='#fbbf24';ctx.fillRect(p.x,p.y,5,5);}
 ctx.globalAlpha=1;

 ctx.fillStyle='#fff';ctx.font='800 26px system-ui';ctx.fillText('WAVE RUN',24,36);
 ctx.font='16px system-ui';ctx.fillStyle='#cbd5e1';ctx.fillText(`Score: ${score}`,25,66);
 ctx.fillText(`Run Points: +${runPoints}`,25,90);
 

 if(!started&&!dead)overlay('READY?','Hold to go up • Release to go down');
 if(dead)overlay('CRASH!',`Score ${score} • Earned ${runPoints} points • Tap or press Space to retry`);
}

function overlay(title,sub){
 ctx.fillStyle='#0009';ctx.fillRect(0,0,W,H);ctx.textAlign='center';
 ctx.fillStyle='#fff';ctx.font='800 46px system-ui';ctx.fillText(title,W/2,H/2-8);
 ctx.font='20px system-ui';ctx.fillStyle='#dbeafe';ctx.fillText(sub,W/2,H/2+36);ctx.textAlign='left';
}

function draw(){
 if(screen==='menu')drawMenu();
 else if(screen==='shop')drawShop();
 else if(screen==='passes')drawPasses();
 else if(screen==='chests')drawChests();
 else if(screen==='missions')drawMissions();
 else drawGame();
}

function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
